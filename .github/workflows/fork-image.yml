name: Fork latest image

on:
  push:
    branches: [main]
  # Also used by fork-sync.yml: GITHUB_TOKEN pushes do not trigger push runs.
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  build-and-publish:
    if: github.repository == 'jacobtomlinson-bot/llama-swap' && github.ref == 'refs/heads/main' && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: fork-image-latest
      queue: max
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/jacobtomlinson-bot/llama-swap
      MAIN_URL: https://github.com/jacobtomlinson-bot/llama-swap.git
    steps:
      - name: Check whether this commit is still current
        id: current
        run: |
          ref=$(git ls-remote --exit-code "$MAIN_URL" refs/heads/main)
          if [[ "${ref%%$'\t'*}" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping stale main commit $GITHUB_SHA"
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.current.outputs.current == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        if: steps.current.outputs.current == 'true'
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.current.outputs.current == 'true'
        with:
          node-version: "24"
      - name: Build and smoke-test the fork image
        if: steps.current.outputs.current == 'true'
        run: |
          CGO_ENABLED=0 make native GOOS=linux GOARCH=amd64
          context=$(mktemp -d)
          install -m 755 build/llama-swap-linux-amd64 "$context/llama-swap"
          install -m 644 docker/fork-latest.config.yaml "$context/config.yaml"
          docker build --pull --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE:sha-$GITHUB_SHA" -f docker/fork-latest.Containerfile "$context"
          revision="$IMAGE:sha-$GITHUB_SHA"
          docker run --rm --entrypoint /app/llama-swap "$revision" -version |
            grep -F "($(git rev-parse --short HEAD))"
          container=$(docker run --rm -d "$revision")
          trap 'docker stop "$container" >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if docker exec "$container" curl -fsS http://127.0.0.1:8080/health; then
              test "$(docker exec "$container" id -u)" = 10001
              exit 0
            fi
            sleep 1
          done
          docker logs "$container"
          exit 1
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        if: steps.current.outputs.current == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push revision image, then promote its digest if main still matches
        if: steps.current.outputs.current == 'true'
        run: |
          revision="$IMAGE:sha-$GITHUB_SHA"
          docker push "$revision"
          digest=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$revision" | jq -er .digest)
          ref=$(git ls-remote --exit-code "$MAIN_URL" refs/heads/main)
          if [[ "${ref%%$'\t'*}" != "$GITHUB_SHA" ]]; then
            echo "::notice::main moved; leaving latest untouched ($revision was uploaded)"
            exit 0
          fi
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:latest" "$IMAGE@$digest"
          echo "Published \`$IMAGE:latest\` from \`$GITHUB_SHA\` (\`$digest\`)." >> "$GITHUB_STEP_SUMMARY"
